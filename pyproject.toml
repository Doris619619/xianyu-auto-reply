[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xianyu-auto-reply"
version = "0.1.0"
description = "闲鱼 AI 砍价本地工具：链接入队、一家一家议价、超时跳转"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "playwright>=1.55,<2",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
cloakbrowser = [
  "cloakbrowser>=0.5,<0.6",
]
camoufox = [
  "camoufox",
]

[project.scripts]
xianyu-bargain = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "scripts*", "web*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
